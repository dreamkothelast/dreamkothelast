[package]
name = "mas-tablet"
version = "0.1.0"
description = "MAS Tablette — Suite de mini-jeux éducatifs pour adultes en situation de handicap"
authors = []
edition = "2021"

# Crate bibliothèque partagée entre main.rs et le runner Tauri
[lib]
name = "mas_tablet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pas de dépendances réseau — l'appli est 100 % hors-ligne
[profile.release]
# Optimisation taille pour le bundle .msi
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
