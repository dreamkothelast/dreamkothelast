name: Build MAS Tablette — Windows .msi

# Se déclenche sur chaque push dans apps/mas-tablet/ OU manuellement
on:
  push:
    branches:
      - claude/mas-windows-app-o9g4F
      - main
    paths:
      - "apps/mas-tablet/**"
  workflow_dispatch:   # bouton "Run workflow" depuis GitHub Actions

jobs:
  build-windows:
    runs-on: windows-latest   # Machine Windows fournie par GitHub

    steps:
      # 1. Récupérer le code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Rust stable (nécessaire pour Tauri)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. Cache Rust pour accélérer les rebuilds
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mas-tablet/src-tauri -> target

      # 5. Installer les dépendances npm
      - name: Install dependencies
        working-directory: apps/mas-tablet
        run: npm install

      # 6. Compiler l'application Tauri → produit le .msi
      - name: Build Tauri (Windows .msi)
        working-directory: apps/mas-tablet
        run: npm run tauri build

      # 7. Publier le .msi comme artefact téléchargeable depuis GitHub
      - name: Upload .msi
        uses: actions/upload-artifact@v4
        with:
          name: MAS-Tablette-Windows-msi
          path: apps/mas-tablet/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 60   # conservé 60 jours

      # 8. Publier aussi le .exe (installeur NSIS alternatif)
      - name: Upload .exe (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: MAS-Tablette-Windows-exe
          path: apps/mas-tablet/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 60
        continue-on-error: true   # optionnel, pas toujours généré
